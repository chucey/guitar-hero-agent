loading_phrase = "Mama, I'm Coming Home" is the second single from Ozzy Osbourne's sixth album, "No More Tears." In 2022, former Ozzy guitarist, Zakk Wylde, was asked about the creation process of the song with Sleazeroxx.com saying "I remember me and Ozzy originally did that on a piano in my apartment in North Hollywood... I transposed it to guitar when we got in the studio when we were working on the record, and then y'know it sounded great... the song started off with the pedal steel kind of thing. I mean it just sounded great... I mean everybody's performances and everything like that but I mean just the overall sound of it – the guys knocked it out of the park for sure." <br>According to American Songwriter Magazine, the lyrics are inspired by Ozzy's realization that he would be dead if he did not get sober, and the song is dedicated to his wife Sharon for staying with him during his crazier early days.

